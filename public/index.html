<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K1Chat</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1117">
<style>
  html,body{height:100%;margin:0;background:#0f1117;display:flex;align-items:center;justify-content:center}
  .mark{color:#3ecfb2;font:800 20px 'Nunito',system-ui,sans-serif;letter-spacing:-.5px}
</style>
</head>
<body>
<span class="mark">K1Chat</span>
<script src="/common.js"></script>
<script>
  (async function routeRoot() {
    if (!getToken()) { location.replace('/login'); return; }
    try {
      await fetchJSON('/api/users/me');
      location.replace('/chat');
    } catch (e) {
      clearToken();
      location.replace('/login');
    }
  })();
</script>
</body>
</html>
