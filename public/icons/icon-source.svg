    </filter>
    <path id="bubble" d="M100,0 H240 A100,100 0 0 1 340,100 V200 A100,100 0 0 1 240,300 H130 L75,392 L60,300 H100 A100,100 0 0 1 0,200 V100 A100,100 0 0 1 100,0 Z"/>
