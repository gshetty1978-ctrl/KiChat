    <use href="#bubble" fill="none" stroke="url(#stroke)" stroke-width="22" stroke-linejoin="round"/>
  </g>

  <text x="256" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="118" letter-spacing="-2" fill="url(#text)">K1</text>
  <text x="256" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="46" letter-spacing="6" fill="url(#text)">CHAT</text>
