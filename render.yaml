databases:
  - name: kichat-db
    plan: free
    databaseName: kichat
    user: kichat

services:
  - type: web
    name: kichat
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kichat-db
          property: connectionString
